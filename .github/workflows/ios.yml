name: iOS

# Path-filtered so backend/frontend-only changes never spin up a macos
# runner. Kept in its own workflow file (rather than a job with an `if:`)
# so the paths filter applies at trigger time, not job-skip time.
on:
  pull_request:
    paths:
      - "ios/**"
  push:
    branches: [main]
    paths:
      - "ios/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS (swift test)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # #251: privacy manifests must be well-formed plists (TestFlight required-reason APIs).
      - name: Lint PrivacyInfo.xcprivacy
        run: |
          set -euo pipefail
          for f in \
            ios/EMSControl/Sources/EMSControlApp/PrivacyInfo.xcprivacy \
            ios/EMSControl/Sources/EMSWidget/PrivacyInfo.xcprivacy \
            ios/EMSControl/Sources/EMSControlCore/PrivacyInfo.xcprivacy
          do
            echo "lint $f"
            plutil -lint "$f"
            # NSPrivacyTracking false; UserDefaults reasons CA92.1 (app) + 1C8F.1 (App Group).
            grep -q 'NSPrivacyTracking' "$f"
            grep -q '<false/>' "$f"
            grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' "$f"
            grep -q 'CA92.1' "$f"
            grep -q '1C8F.1' "$f"
            grep -q 'NSPrivacyTrackingDomains' "$f"
            grep -q 'NSPrivacyCollectedDataTypes' "$f"
          done
          # Packaging: committed Xcode project must Copy Bundle each manifest (#251).
          echo "check project.pbxproj membership"
          count=$(grep -c 'PrivacyInfo.xcprivacy in Resources' ios/EMSControl/EMSControl.xcodeproj/project.pbxproj)
          # 3 PBXBuildFile rows + 3 Resources-phase file entries.
          test "$count" -ge 6

      # #252: export compliance — no manual ASC prompt on TestFlight upload.
      - name: Check ITSAppUsesNonExemptEncryption
        run: |
          set -euo pipefail
          for f in \
            ios/EMSControl/Sources/EMSControlApp/Info.plist \
            ios/EMSControl/Sources/EMSWidget/Info.plist
          do
            echo "check $f"
            plutil -lint "$f"
            plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$f" | grep -qx 'false'
          done
          grep -q 'ITSAppUsesNonExemptEncryption' ios/EMSControl/project.yml

      # #253: Debug keeps .dev side-by-side; Release uses App Store bundle ids.
      # CURRENT_PROJECT_VERSION stays overridable from CI (xcodebuild var).
      - name: Check Debug/Release bundle identifiers
        run: |
          set -euo pipefail
          yml=ios/EMSControl/project.yml
          pbx=ios/EMSControl/EMSControl.xcodeproj/project.pbxproj
          # project.yml config blocks
          grep -A2 'Debug:' "$yml" | grep -q 'com.jeroenniesen.emscontrol.dev$'
          grep -A2 'Release:' "$yml" | grep -q 'com.jeroenniesen.emscontrol$'
          grep -A2 'Debug:' "$yml" | grep -q 'com.jeroenniesen.emscontrol.dev.widget$'
          grep -A2 'Release:' "$yml" | grep -q 'com.jeroenniesen.emscontrol.widget$'
          # Committed pbxproj Release configs (xcodegen may be absent on the runner).
          # App Release must not still carry .dev; widget Release must use .widget.
          python3 - <<'PY'
          from pathlib import Path
          text = Path("ios/EMSControl/EMSControl.xcodeproj/project.pbxproj").read_text()
          # Split into named XCBuildConfiguration blocks; assert Release IDs.
          import re
          blocks = re.findall(
              r"/\* (Debug|Release) \*/ = \{\s*isa = XCBuildConfiguration;\s*buildSettings = \{(.*?)\};\s*name = \1;",
              text,
              flags=re.S,
          )
          app_release = widget_release = app_debug = widget_debug = None
          for name, body in blocks:
              if "PRODUCT_NAME = EMSControl;" in body and "PRODUCT_BUNDLE_IDENTIFIER" in body:
                  m = re.search(r"PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);", body)
                  assert m, body
                  if name == "Release":
                      app_release = m.group(1).strip()
                  else:
                      app_debug = m.group(1).strip()
              if "PRODUCT_NAME = EMSWidget;" in body and "PRODUCT_BUNDLE_IDENTIFIER" in body:
                  m = re.search(r"PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);", body)
                  assert m, body
                  if name == "Release":
                      widget_release = m.group(1).strip()
                  else:
                      widget_debug = m.group(1).strip()
          assert app_debug == "com.jeroenniesen.emscontrol.dev", app_debug
          assert app_release == "com.jeroenniesen.emscontrol", app_release
          assert widget_debug == "com.jeroenniesen.emscontrol.dev.widget", widget_debug
          assert widget_release == "com.jeroenniesen.emscontrol.widget", widget_release
          print("bundle ids OK", app_debug, app_release, widget_debug, widget_release)
          PY
          # Version keys must come from build settings so CI can bump build number.
          for f in \
            ios/EMSControl/Sources/EMSControlApp/Info.plist \
            ios/EMSControl/Sources/EMSWidget/Info.plist
          do
            plutil -extract CFBundleShortVersionString raw -o - "$f" | grep -qx '$(MARKETING_VERSION)'
            plutil -extract CFBundleVersion raw -o - "$f" | grep -qx '$(CURRENT_PROJECT_VERSION)'
          done
          # Shared App Group in both entitlements (Debug + Release).
          for f in \
            ios/EMSControl/Sources/EMSControlApp/EMSControl.entitlements \
            ios/EMSControl/Sources/EMSWidget/EMSWidget.entitlements
          do
            grep -q 'group.com.jeroenniesen.emscontrol' "$f"
          done


      # #254: honest local-network permission copy (no Bonjour / "search" claim).
      - name: Check NSLocalNetworkUsageDescription
        run: |
          set -euo pipefail
          app=ios/EMSControl/Sources/EMSControlApp/Info.plist
          widget=ios/EMSControl/Sources/EMSWidget/Info.plist
          plutil -lint "$app"
          desc=$(plutil -extract NSLocalNetworkUsageDescription raw -o - "$app")
          echo "desc=$desc"
          # Must mention connect + user-entered server; must not claim network search/discovery.
          echo "$desc" | grep -qi 'connect'
          echo "$desc" | grep -Eqi 'enter|configur|you (set|provide|type)'
          echo "$desc" | grep -Eivq 'search|discover|scan|bonjour|find your'
          # No Bonjour services key on app or widget; local networking ATS stays on.
          # Note: `! cmd` under `set -e` does NOT fail the step when cmd succeeds — use if/exit.
          if plutil -extract NSBonjourServices raw -o /dev/null "$app" 2>/dev/null; then
            echo "NSBonjourServices must not be present in $app" >&2
            exit 1
          fi
          if plutil -extract NSBonjourServices raw -o /dev/null "$widget" 2>/dev/null; then
            echo "NSBonjourServices must not be present in $widget" >&2
            exit 1
          fi
          plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw -o - "$app" | grep -qx 'true'
          plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw -o - "$widget" | grep -qx 'true'

      # #257: configurable privacy/support URLs for Settings + connection footer.
      - name: Check EMS privacy/support Info.plist URLs
        run: |
          set -euo pipefail
          app=ios/EMSControl/Sources/EMSControlApp/Info.plist
          for key in EMSPrivacyPolicyURL EMSSupportURL; do
            val=$(plutil -extract "$key" raw -o - "$app")
            echo "$key=$val"
            echo "$val" | grep -Eq '^https://'
          done
          grep -q 'AppLinks.swift' ios/EMSControl/EMSControl.xcodeproj/project.pbxproj
          grep -q 'SettingsView.swift' ios/EMSControl/EMSControl.xcodeproj/project.pbxproj

      # SPM `swift test` only — no xcodegen (not guaranteed to be installed
      # on the runner) and no xcodebuild (app target isn't part of this
      # gate). The runner's default DEVELOPER_DIR already points at a full
      # Xcode install, so no override is needed here.
      - name: swift test
        working-directory: ios/EMSControl
        run: swift test
